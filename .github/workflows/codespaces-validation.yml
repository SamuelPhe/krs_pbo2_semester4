name: Validate KRS Codespaces setup

on:
  push:
    branches: [master]
    paths:
      - ".devcontainer/**"
      - ".github/workflows/codespaces-validation.yml"
      - "pom.xml"
      - "src/main/java/**"
      - "src/main/resources/**"
      - "krs_db.sql"
      - "database/web_auth_password_migration.sql"
      - "webapp/**"
      - "tests/**"
  pull_request:
    branches: [master]
    paths:
      - ".devcontainer/**"
      - ".github/workflows/codespaces-validation.yml"
      - "pom.xml"
      - "src/main/java/**"
      - "src/main/resources/**"
      - "krs_db.sql"
      - "database/web_auth_password_migration.sql"
      - "webapp/**"
      - "tests/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Validate Codespaces configuration
        run: |
          python3 -c 'import json; json.load(open(".devcontainer/devcontainer.json"))'
          bash -n .devcontainer/start-desktop-app.sh
          bash -n tests/profile-guard.sh
          bash -n tests/profile-http-smoke.sh
          bash -n tests/krs-period-smoke.sh
          bash -n tests/student-krs-smoke.sh
          bash -n tests/advisor-review-smoke.sh
          bash -n tests/admin-master-smoke.sh
          bash -n tests/remaining-role-modules-smoke.sh
          localWorkspaceFolderBasename=krs docker compose -f .devcontainer/docker-compose.yml config -q
          test -f .devcontainer/php/Dockerfile

      - name: Build original KRS Swing application
        run: mvn -B -DskipTests package dependency:copy-dependencies

      - name: Restore and check original MariaDB snapshot
        run: |
          export localWorkspaceFolderBasename=krs
          if ! docker compose -f .devcontainer/docker-compose.yml up -d --build --wait --wait-timeout 240; then
            docker compose -f .devcontainer/docker-compose.yml logs
            exit 1
          fi
          tables=$(localWorkspaceFolderBasename=krs docker compose -f .devcontainer/docker-compose.yml exec -T database mariadb -uroot -pkrs_root_codespace_only -N -D krs_db -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='krs_db'")
          test "$tables" -eq 11
          password_columns=$(localWorkspaceFolderBasename=krs docker compose -f .devcontainer/docker-compose.yml exec -T database mariadb -uroot -pkrs_root_codespace_only -N -D krs_db -e "SELECT COUNT(*) FROM information_schema.columns WHERE table_schema='krs_db' AND column_name='password' AND character_maximum_length=255")
          test "$password_columns" -eq 3
          localWorkspaceFolderBasename=krs docker compose -f .devcontainer/docker-compose.yml exec -T web php -l /var/www/html/config.php
          localWorkspaceFolderBasename=krs docker compose -f .devcontainer/docker-compose.yml exec -T web php -l /var/www/html/index.php
          localWorkspaceFolderBasename=krs docker compose -f .devcontainer/docker-compose.yml exec -T web php -l /var/www/html/profile.php
          localWorkspaceFolderBasename=krs docker compose -f .devcontainer/docker-compose.yml exec -T web php -l /var/www/html/krs.php
          localWorkspaceFolderBasename=krs docker compose -f .devcontainer/docker-compose.yml exec -T web php -l /var/www/html/pengajuan.php
          localWorkspaceFolderBasename=krs docker compose -f .devcontainer/docker-compose.yml exec -T web php -l /var/www/html/review.php
          localWorkspaceFolderBasename=krs docker compose -f .devcontainer/docker-compose.yml exec -T web php -l /var/www/html/master-user.php
          localWorkspaceFolderBasename=krs docker compose -f .devcontainer/docker-compose.yml exec -T web php -l /var/www/html/master-data.php
          localWorkspaceFolderBasename=krs docker compose -f .devcontainer/docker-compose.yml exec -T web php -l /var/www/html/finalisasi.php
          localWorkspaceFolderBasename=krs docker compose -f .devcontainer/docker-compose.yml exec -T web php -l /var/www/html/riwayat.php
          localWorkspaceFolderBasename=krs docker compose -f .devcontainer/docker-compose.yml exec -T web php -l /var/www/html/jadwal-ajar.php
          localWorkspaceFolderBasename=krs docker compose -f .devcontainer/docker-compose.yml exec -T web php -l /var/www/html/mahasiswa-pa.php
          web_page=$(curl --fail --silent --show-error http://127.0.0.1:8081/)
          printf '%s' "$web_page" | grep -q 'KRS — Sistem Informasi Akademik'
          db_counts=$(localWorkspaceFolderBasename=krs docker compose -f .devcontainer/docker-compose.yml exec -T web php -r '$pdo = new PDO("mysql:host=".getenv("DB_HOST").";dbname=".getenv("DB_DATABASE"), getenv("DB_USER"), getenv("DB_PASSWORD")); echo $pdo->query("SELECT COUNT(*) FROM mahasiswa")->fetchColumn();')
          test "$db_counts" -gt 0

      - name: Verify authenticated profile workflows
        run: |
          profile_password="$(openssl rand -hex 20)"
          next_password="$(openssl rand -hex 20)"
          localWorkspaceFolderBasename=krs docker compose -f .devcontainer/docker-compose.yml exec -T -e KRS_PROFILE_PASSWORD="$profile_password" web php -r '
            require "/var/www/html/config.php";
            $pdo = krs_db();
            $hash = krs_password_hash((string)getenv("KRS_PROFILE_PASSWORD"));
            $pdo->prepare("INSERT INTO admin (id_admin, nama_admin, password) VALUES (?, ?, ?)")->execute([990001, "KRS Profile Admin", $hash]);
            $pdo->prepare("INSERT INTO mahasiswa (id_mahasiswa, id_prodi, id_dosen_pa, nama_mahasiswa, angkatan, password, semester) VALUES (?, ?, ?, ?, ?, ?, ?)")->execute([990001, 111, 10002, "KRS Profile Student", 2025, $hash, 4]);
            $dosen = $pdo->prepare("INSERT INTO dosen (id_dosen, nama_dosen, posisi, password) VALUES (?, ?, ?, ?)");
            $dosen->execute([990001, "KRS Profile Lecturer", "dosen", $hash]);
            $dosen->execute([990002, "KRS Profile Advisor", "dosen pa", $hash]);
            $dosen->execute([990003, "KRS Profile Head", "kaprodi", $hash]);
          '
          KRS_PROFILE_PASSWORD="$profile_password" KRS_PROFILE_NEXT_PASSWORD="$next_password" bash tests/profile-http-smoke.sh http://127.0.0.1:8081
          password_status=$(localWorkspaceFolderBasename=krs docker compose -f .devcontainer/docker-compose.yml exec -T -e KRS_PROFILE_NEXT_PASSWORD="$next_password" web php -r '
            require "/var/www/html/config.php";
            $statement = krs_db()->prepare("SELECT password FROM admin WHERE id_admin = ?");
            $statement->execute([990001]);
            $stored = (string)$statement->fetchColumn();
            echo krs_password_verify((string)getenv("KRS_PROFILE_NEXT_PASSWORD"), $stored) ? "verified" : "failed";
          ')
          test "$password_status" = "verified"

      - name: Verify admin KRS period management
        run: |
          period_password="$(openssl rand -hex 20)"
          localWorkspaceFolderBasename=krs docker compose -f .devcontainer/docker-compose.yml exec -T -e KRS_PERIOD_TEST_PASSWORD="$period_password" web php -r '
            require "/var/www/html/config.php";
            $pdo = krs_db();
            $hash = krs_password_hash((string)getenv("KRS_PERIOD_TEST_PASSWORD"));
            $pdo->prepare("INSERT INTO admin (id_admin, nama_admin, password) VALUES (?, ?, ?)")->execute([991001, "KRS Period Admin", $hash]);
            $pdo->prepare("INSERT INTO mahasiswa (id_mahasiswa, id_prodi, id_dosen_pa, nama_mahasiswa, angkatan, password, semester) VALUES (?, ?, ?, ?, ?, ?, ?)")->execute([991001, 111, 10002, "KRS Period Student", 2025, $hash, 4]);
          '
          KRS_PERIOD_TEST_PASSWORD="$period_password" bash tests/krs-period-smoke.sh http://127.0.0.1:8081

      - name: Verify student KRS submission and course selection
        run: |
          application_password="$(openssl rand -hex 20)"
          application_session_id=$(localWorkspaceFolderBasename=krs docker compose -f .devcontainer/docker-compose.yml exec -T -e KRS_APPLICATION_TEST_PASSWORD="$application_password" web php -r '
            require "/var/www/html/config.php";
            $pdo = krs_db();
            $hash = krs_password_hash((string)getenv("KRS_APPLICATION_TEST_PASSWORD"));
            $student = $pdo->prepare("INSERT INTO mahasiswa (id_mahasiswa, id_prodi, id_dosen_pa, nama_mahasiswa, angkatan, password, semester) VALUES (?, ?, ?, ?, ?, ?, ?)");
            $student->execute([992001, 111, 10002, "KRS Application Student", 2025, $hash, 2]);
            $student->execute([992002, 111, 10002, "KRS Application Other Student", 2025, $hash, 2]);
            $pdo->exec("INSERT INTO krs (id_prodi, semester, tahun_ajaran, status_krs, tanggal_mulai, tanggal_selesai) VALUES (111, 2, YEAR(CURRENT_DATE), '\''terbuka'\'', CURRENT_DATE, DATE_ADD(CURRENT_DATE, INTERVAL 30 DAY))");
            $sessionId = (int)$pdo->lastInsertId();
            $pdo->exec("DELETE FROM jadwal WHERE id_jadwal = 99");
            $pdo->exec("INSERT INTO jadwal (id_jadwal, id_matkul, id_dosen, hari, kelas, jam_mulai, jam_selesai, ruang) VALUES (99, 1002, 10001, '\''senin'\'', '\''4'\'', '\''16:30:00'\'', '\''18:00:00'\'', '\''5'\'')");
            echo $sessionId;
          ')
          KRS_APPLICATION_TEST_PASSWORD="$application_password" KRS_APPLICATION_SESSION_ID="$application_session_id" bash tests/student-krs-smoke.sh http://127.0.0.1:8081

      - name: Verify Dosen PA review and approval
        run: |
          review_password="$(openssl rand -hex 20)"
          localWorkspaceFolderBasename=krs docker compose -f .devcontainer/docker-compose.yml exec -T -e KRS_REVIEW_TEST_PASSWORD="$review_password" web php -r '
            require "/var/www/html/config.php";
            $pdo = krs_db();
            $hash = krs_password_hash((string)getenv("KRS_REVIEW_TEST_PASSWORD"));
            $dosen = $pdo->prepare("INSERT INTO dosen (id_dosen, nama_dosen, posisi, password) VALUES (?, ?, ?, ?)");
            $dosen->execute([993001, "KRS Review Advisor", "dosen pa", $hash]);
            $dosen->execute([993002, "KRS Review Other Advisor", "dosen pa", $hash]);
            $dosen->execute([993003, "KRS Review Lecturer", "dosen", $hash]);
            $students = $pdo->prepare("INSERT INTO mahasiswa (id_mahasiswa, id_prodi, id_dosen_pa, nama_mahasiswa, angkatan, password, semester) VALUES (?, 111, ?, ?, 2025, ?, 2)");
            $students->execute([993001, 993001, "KRS Review Student", $hash]);
            $students->execute([993002, 993002, "KRS Review Other Student", $hash]);
            $session = $pdo->prepare("INSERT INTO krs (id_prodi, semester, tahun_ajaran, status_krs, tanggal_mulai, tanggal_selesai) VALUES (111, 2, YEAR(CURRENT_DATE), ?, CURRENT_DATE, DATE_ADD(CURRENT_DATE, INTERVAL 30 DAY))");
            $session->execute(["terbuka"]);
            $sessionId = (int)$pdo->lastInsertId();
            $applications = $pdo->prepare("INSERT INTO pengajuan_krs (id_pengajuan, id_krs, id_mahasiswa, tanggal_pengajuan, status_acc) VALUES (?, ?, ?, CURRENT_DATE, ?)");
            $applications->execute([993001, $sessionId, 993001, "Ditinjau"]);
            $applications->execute([993002, $sessionId, 993002, "Ditinjau"]);
            $details = $pdo->prepare("INSERT INTO krs_detail (id_detail, id_pengajuan, id_jadwal, status_acc) VALUES (?, ?, ?, ?)");
            $details->execute([993001, 993001, 14, "Ditinjau"]);
            $details->execute([993002, 993001, 16, "Ditinjau"]);
            $details->execute([993003, 993002, 14, "Ditinjau"]);
          '
          KRS_REVIEW_TEST_PASSWORD="$review_password" bash tests/advisor-review-smoke.sh http://127.0.0.1:8081
          review_result=$(localWorkspaceFolderBasename=krs docker compose -f .devcontainer/docker-compose.yml exec -T web php -r '
            require "/var/www/html/config.php";
            $pdo = krs_db();
            $status = $pdo->query("SELECT id_pengajuan, status_acc, id_dosen_acc FROM pengajuan_krs WHERE id_pengajuan IN (993001, 993002) ORDER BY id_pengajuan")->fetchAll(PDO::FETCH_NUM);
            $detailStatus = $pdo->query("SELECT id_detail, status_acc, catatan_revisi FROM krs_detail WHERE id_detail IN (993001, 993002, 993003) ORDER BY id_detail")->fetchAll(PDO::FETCH_NUM);
            echo json_encode([$status, $detailStatus]);
          ')
          REVIEW_RESULT="$review_result" php -r '
            $data = json_decode((string)getenv("REVIEW_RESULT"), true, 512, JSON_THROW_ON_ERROR);
            if ($data[0][0][1] !== "Ditolak" || (int)$data[0][0][2] !== 993001) exit(1);
            if ($data[0][1][1] !== "AccDosenPA" || (int)$data[0][1][2] !== 993002) exit(1);
            if ($data[1][0][1] !== "Disetujui" || $data[1][1][1] !== "Ditolak" || $data[1][2][1] !== "Disetujui") exit(1);
            if (!str_contains((string)$data[1][1][2], "Ganti jadwal kuliah")) exit(1);
            echo "PASS: Dosen PA status transitions and revision persistence verified.\n";
          '

      - name: Verify Admin CRUD, reports, Kaprodi, Jadwal Ajar, and Mahasiswa PA
        run: |
          remaining_password="$(openssl rand -hex 20)"
          localWorkspaceFolderBasename=krs docker compose -f .devcontainer/docker-compose.yml exec -T -e KRS_REMAINING_PASSWORD="$remaining_password" web php -r '
            require "/var/www/html/config.php";
            $pdo = krs_db();
            $hash = krs_password_hash((string)getenv("KRS_REMAINING_PASSWORD"));
            $dosen = $pdo->prepare("INSERT INTO dosen (id_dosen, nama_dosen, posisi, password) VALUES (?, ?, ?, ?)");
            $dosen->execute([995001, "KRS Remaining Kaprodi", "kaprodi", $hash]);
            $dosen->execute([995002, "KRS Remaining Advisor", "dosen pa", $hash]);
            $dosen->execute([995003, "KRS Remaining Lecturer", "dosen", $hash]);
            $dosen->execute([995004, "KRS Other Kaprodi", "kaprodi", $hash]);
            $dosen->execute([995005, "KRS Other Advisor", "dosen pa", $hash]);
            $pdo->prepare("INSERT INTO admin (id_admin, nama_admin, password) VALUES (?, ?, ?)")->execute([995001, "KRS Remaining Admin", $hash]);
            $pdo->exec("UPDATE prodi SET id_kaprodi = 995001 WHERE id_prodi = 122");
            $pdo->exec("UPDATE prodi SET id_kaprodi = 995004 WHERE id_prodi = 133");
            $student = $pdo->prepare("INSERT INTO mahasiswa (id_mahasiswa, id_prodi, id_dosen_pa, nama_mahasiswa, angkatan, password, semester) VALUES (?, ?, ?, ?, 2025, ?, 3)");
            $student->execute([995001, 122, 995002, "KRS Remaining Student", $hash]);
            $student->execute([995002, 122, 995002, "KRS Remaining Second Student", $hash]);
            $student->execute([995003, 133, 995005, "KRS Other Assigned Student", $hash]);
            $pdo->exec("INSERT INTO matkul (id_matkul, id_prodi, nama_matkul, sks, semester) VALUES (995001, 122, '\''KRS Remaining Course'\'', 3, 3)");
            $pdo->exec("INSERT INTO jadwal (id_jadwal, id_matkul, id_dosen, hari, kelas, jam_mulai, jam_selesai, ruang) VALUES (995001, 995001, 995003, '\''jumat'\'', '\''1'\'', '\''18:00:00'\'', '\''19:00:00'\'', '\''5'\'')");
            $session = $pdo->prepare("INSERT INTO krs (id_prodi, id_dosen_pa, semester, tahun_ajaran, status_krs, tanggal_mulai, tanggal_selesai) VALUES (122, 995002, 3, YEAR(CURRENT_DATE), '\''terbuka'\'', CURRENT_DATE, DATE_ADD(CURRENT_DATE, INTERVAL 30 DAY))");
            $session->execute();
            $sessionId = (int)$pdo->lastInsertId();
            $application = $pdo->prepare("INSERT INTO pengajuan_krs (id_pengajuan, id_krs, id_mahasiswa, tanggal_pengajuan, status_acc) VALUES (?, ?, ?, CURRENT_DATE, '\''AccDosenPA'\'')");
            $application->execute([995001, $sessionId, 995001]);
            $application->execute([995002, $sessionId, 995002]);
            $detail = $pdo->prepare("INSERT INTO krs_detail (id_detail, id_pengajuan, id_jadwal, status_acc) VALUES (?, ?, 995001, '\''Disetujui'\'')");
            $detail->execute([995001, 995001]);
            $detail->execute([995002, 995002]);
          '
          KRS_REMAINING_PASSWORD="$remaining_password" bash tests/admin-master-smoke.sh http://127.0.0.1:8081
          KRS_REMAINING_PASSWORD="$remaining_password" bash tests/remaining-role-modules-smoke.sh http://127.0.0.1:8081

      - name: Stop local services
        if: always()
        run: |
          localWorkspaceFolderBasename=krs docker compose -f .devcontainer/docker-compose.yml down -v
