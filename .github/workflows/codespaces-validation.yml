name: Validate KRS Codespaces setup

on:
  push:
    branches: [master]
    paths:
      - ".devcontainer/**"
      - ".github/workflows/codespaces-validation.yml"
      - "pom.xml"
      - "src/main/java/**"
      - "src/main/resources/**"
      - "krs_db.sql"
      - "database/web_auth_password_migration.sql"
  pull_request:
    branches: [master]
    paths:
      - ".devcontainer/**"
      - ".github/workflows/codespaces-validation.yml"
      - "pom.xml"
      - "src/main/java/**"
      - "src/main/resources/**"
      - "krs_db.sql"
      - "database/web_auth_password_migration.sql"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Validate Codespaces configuration
        run: |
          python3 -c 'import json; json.load(open(".devcontainer/devcontainer.json"))'
          bash -n .devcontainer/start-desktop-app.sh
          localWorkspaceFolderBasename=krs docker compose -f .devcontainer/docker-compose.yml config -q

      - name: Build original KRS Swing application
        run: mvn -B -DskipTests package dependency:copy-dependencies

      - name: Restore and check original MariaDB snapshot
        run: |
          export localWorkspaceFolderBasename=krs
          if ! docker compose -f .devcontainer/docker-compose.yml up -d --wait --wait-timeout 180 database; then
            docker compose -f .devcontainer/docker-compose.yml logs database
            exit 1
          fi
          tables=$(localWorkspaceFolderBasename=krs docker compose -f .devcontainer/docker-compose.yml exec -T database mariadb -uroot -pkrs_root_codespace_only -N -D krs_db -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='krs_db'")
          test "$tables" -eq 11
          password_columns=$(localWorkspaceFolderBasename=krs docker compose -f .devcontainer/docker-compose.yml exec -T database mariadb -uroot -pkrs_root_codespace_only -N -D krs_db -e "SELECT COUNT(*) FROM information_schema.columns WHERE table_schema='krs_db' AND column_name='password' AND character_maximum_length=255")
          test "$password_columns" -eq 3

      - name: Stop local services
        if: always()
        run: |
          localWorkspaceFolderBasename=krs docker compose -f .devcontainer/docker-compose.yml down -v
