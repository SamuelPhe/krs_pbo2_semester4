services:
  workspace:
    image: mcr.microsoft.com/devcontainers/base:ubuntu
    command: sleep infinity
    volumes:
      - ..:/workspaces/${localWorkspaceFolderBasename}:cached
    depends_on:
      database:
        condition: service_healthy
    shm_size: "1gb"
    environment:
      DB_HOST: database
      DB_PORT: "3306"
      DB_DATABASE: krs_db
      DB_USER: krs_local
      DB_PASSWORD: krs_codespace_only


  web:
    build:
      context: .
      dockerfile: php/Dockerfile
    restart: unless-stopped
    ports:
      - "8081:80"
    volumes:
      - "../webapp:/var/www/html:ro"
    depends_on:
      database:
        condition: service_healthy
    environment:
      DB_HOST: database
      DB_PORT: "3306"
      DB_DATABASE: krs_db
      DB_USER: krs_local
      DB_PASSWORD: krs_codespace_only
    healthcheck:
      test: ["CMD", "php", "-l", "/var/www/html/index.php"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  database:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: krs_db
      MARIADB_USER: krs_local
      MARIADB_PASSWORD: krs_codespace_only
      MARIADB_ROOT_PASSWORD: krs_root_codespace_only
    volumes:
      - krs-db-data:/var/lib/mysql
      - "../krs_db.sql:/docker-entrypoint-initdb.d/01-krs-dump.sql:ro"
      - "../database/web_auth_password_migration.sql:/docker-entrypoint-initdb.d/02-password-columns.sql:ro"
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping --protocol=tcp -h 127.0.0.1 -uroot -pkrs_root_codespace_only --silent"]
      start_period: 45s
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  krs-db-data:
